# Yerel geliştirme için PostgreSQL.
# Başlatma: docker compose up -d db
services:
  db:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: amisos
      POSTGRES_PASSWORD: amisos
      POSTGRES_DB: amisos_b2b
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amisos -d amisos_b2b"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
